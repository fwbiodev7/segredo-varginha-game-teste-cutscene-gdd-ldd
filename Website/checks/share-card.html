<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Imagem de compartilhamento</title><style>@font-face{font-family:Pixel;src:url(assets/pixel.ttf)}body{margin:0;background:#0c1317}img{max-width:100%;display:block}button{padding:15px;margin:20px;font-family:monospace}</style><body><img id="card" alt="O Segredo de Varginha sobre uma rua noturna em pixel art"><script>
(async()=>{const bg=new Image();bg.src='assets/hero.webp';await bg.decode();await document.fonts.load('50px Pixel');const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=630;const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(bg,0,0,bg.width,bg.height,0,0,1200,630);const g=c.createLinearGradient(0,0,1200,0);g.addColorStop(0,'rgba(7,16,23,.95)');g.addColorStop(.62,'rgba(7,16,23,.76)');g.addColorStop(1,'rgba(7,16,23,.25)');c.fillStyle=g;c.fillRect(0,0,1200,630);c.fillStyle='#dca85c';c.font='12px Pixel';c.fillText('UM MISTÉRIO BRASILEIRO EM PIXEL ART',65,110);c.fillStyle='#ebe3cf';c.font='50px Pixel';c.fillText('O SEGREDO',65,245);c.font='24px Pixel';c.fillText('DE',65,300);c.fillStyle='#dca85c';c.font='64px Pixel';c.fillText('VARGINHA',65,390);c.fillStyle='#ebe3cf';c.font='25px Georgia';c.fillText('Trinta anos depois, uma caixa reabre',65,470);c.fillText('a noite que Edelzio esqueceu.',65,505);c.fillStyle='#9cb9b2';c.font='10px Pixel';c.fillText('TERROR SOBRENATURAL • INVESTIGAÇÃO',65,575);document.querySelector('#card').src=canvas.toDataURL('image/png');})();
</script></body></html>

const pictures=data.map(c=>c.frames.map(f=>{const i=new Image();i.src=f.image;i.onload=draw;return i}));
data.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name;sel.append(o)});

document.getElementById('play').onclick=()=>{playing=!playing;last=null};
document.getElementById('step').onclick=()=>{playing=false;elapsed=0;advance()};

document.getElementById('scale').onchange=draw;
function tick(t){if(last!==null&&playing){elapsed+=(t-last)*Number(document.getElementById('speed').value);

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Abertura animada de Varginha</title><style>body{margin:0;background:#071018;color:#eee9d2;font:18px Consolas,monospace;text-align:center}main{max-width:1152px;margin:24px auto}img{max-width:100%;width:1152px;image-rendering:pixelated}button,input{font:inherit;margin:14px;padding:10px}p{line-height:1.5}</style><main><h1>Abertura de 1996</h1><p>Prévia silenciosa com quadros capturados no Player Windows. No jogo, a sequência inclui os efeitos sonoros.</p><img id="frame" alt="Animação capturada do jogo"><div><button id="play">Pausar</button><button id="reset">Recomeçar</button><input id="seek" type="range" min="0" max="71" value="0"><span id="status"></span></div><p>Jornal, noticiário, sala com Edelzio criança e retorno à exploração.<br>A gravação foi amostrada; use o executável para conferir ritmo, som e controles.</p><script>const frames=["0000.png","0001.png","0002.png","0003.png","0004.png","0005.png","0006.png","0007.png","0008.png","0009.png","0010.png","0011.png","0012.png","0013.png","0014.png","0015.png","0016.png","0017.png","0018.png","0019.png","0020.png","0021.png","0022.png","0023.png","0024.png","0025.png","0026.png","0027.png","0028.png","0029.png","0030.png","0031.png","0032.png","0033.png","0034.png","0035.png","0036.png","0037.png","0038.png","0039.png","0040.png","0041.png","0042.png","0043.png","0044.png","0045.png","0046.png","0047.png","0048.png","0049.png","0050.png","0051.png","0052.png","0053.png","0054.png","0055.png","0056.png","0057.png","0058.png","0059.png","0060.png","0061.png","0062.png","0063.png","0064.png","0065.png","0066.png","0067.png","0068.png","0069.png","0070.png","0071.png"],image=document.querySelector('#frame'),seek=document.querySelector('#seek');let n=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;function show(){image.src="opening-film/"+frames[n];seek.value=n;document.querySelector('#status').textContent=(n+1)+' / '+frames.length}show();setInterval(()=>{if(playing){n=(n+1)%frames.length;show()}},300);document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pausar':'Reproduzir'};document.querySelector('#reset').onclick=()=>{n=0;show()};seek.oninput=()=>{n=+seek.value;show()};</script></main></html>

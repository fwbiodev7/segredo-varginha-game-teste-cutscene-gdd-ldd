ctx=cv.getContext('2d'),status=document.getElementById('status');let ci=0,fi=0,playing=true,last=null,elapsed=0;
const pictures=data.map(c=>c.frames.map(f=>{const i=new Image();i.src=f.image;i.onload=draw;return i}));
data.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name;sel.append(o)});
function draw(){const c=data[ci],s=Math.max(1,Math.min(16,Math.floor(Number(document.getElementById('scale').value)||1)));
cv.width=c.width*s;cv.height=c.height*s;ctx.imageSmoothingEnabled=false;ctx.drawImage(pictures[ci][fi],0,0,cv.width,cv.height);
status.textContent=c.name+' | '+(fi+1)+'/'+c.frames.length+' | '+c.frames[fi].id+' | '+c.frames[fi].ms+' ms | '+(c.loop?'loop':'one-shot')+' | '+c.registration}
function advance(){const c=data[ci];if(fi+1<c.frames.length)fi++;else if(c.loop)fi=0;else playing=false;draw()}
sel.onchange=()=>{ci=Number(sel.value);fi=0;elapsed=0;last=null;playing=true;draw()};
document.getElementById('play').onclick=()=>{playing=!playing;last=null};
document.getElementById('step').onclick=()=>{playing=false;elapsed=0;advance()};
document.getElementById('reset').onclick=()=>{fi=0;elapsed=0;last=null;playing=true;draw()};
document.getElementById('scale').onchange=draw;
function tick(t){if(last!==null&&playing){elapsed+=(t-last)*Number(document.getElementById('speed').value);
let guard=0;while(playing&&elapsed>=data[ci].frames[fi].ms&&guard++<1000){elapsed-=data[ci].frames[fi].ms;advance()}}
last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
